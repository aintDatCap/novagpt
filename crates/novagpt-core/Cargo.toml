[package]
name = "novagpt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
reqwest.workspace = true
# Reuse ripgrep's search engine and ignore-aware file walker. Pin pre-2026
# compatible releases to preserve the workspace's Rust 1.88 MSRV.
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
ignore = "=0.4.34"

[dev-dependencies]
tempfile = "3"
