[workspace]
members = ["crates/novagpt-core", "crates/novagpt-mcp", "crates/novagpt-cli", "crates/novagpt-vm", "crates/novagpt-agents", "crates/novagpt-browser"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "fs", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
