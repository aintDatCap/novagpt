name: PR testing

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust, rustfmt and Clippy
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # Include rustc, build flags and all manifests in the cache identity;
      # save newly compiled dependencies instead of keeping a fixed lockfile key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          key: ${{ matrix.os }}
      - name: Check Windows PowerShell 5.1 installer architecture compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Windows PowerShell 5.x is required for this test.' }
          .\script\test_install.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test development supervisor on both platforms
        run: python script/test_dev.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run tests and collect timing report
        run: cargo test --workspace --locked --timings
      - name: Upload per-target Cargo test timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-pr-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
