name: Manual release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novagpt-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version from workspace Cargo.toml
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch only."
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported Cargo version: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing NovaGPT v$version"
      - name: Prevent overwriting an existing tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$refs" ]]; then
            echo "::error::Tag $RELEASE_TAG already exists. Bump workspace.package.version first."
            exit 1
          fi

  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust, rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # Include rustc, build flags and all manifests in the cache identity;
      # save newly compiled dependencies instead of keeping a fixed lockfile key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          key: release-verify
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked --timings
      - name: Upload verification timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-verify-linux-x86_64
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Use the Linux linker only where available; native Windows linking stays unchanged.
      - name: Prefer LLVM lld on Linux when installed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v clang >/dev/null && command -v ld.lld >/dev/null; then
            echo 'RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
            echo 'Using clang + lld for faster Linux linking.'
          else
            echo '::notice::clang/lld not present; using the default system linker.'
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          cache-on-failure: "true"
          key: ${{ matrix.platform }}
      - name: Check Windows PowerShell 5.1 installer architecture compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Windows PowerShell 5.x is required for this test.' }
          .\script\test_install.ps1
      - name: Build native release binary
        run: cargo build --release --locked -p novagpt-cli --timings
      - name: Upload per-target Cargo timing report
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.platform }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Package executable and SHA-256
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          platform = os.environ["PLATFORM"]
          is_windows = platform.startswith("windows-")
          executable = Path("target/release") / ("novagpt.exe" if is_windows else "novagpt")
          if not executable.is_file():
              raise SystemExit(f"Missing release executable: {executable}")

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          archive = dist / f"novagpt-{platform}.{ 'zip' if is_windows else 'tar.gz' }"
          if is_windows:
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as out:
                  out.write(executable, executable.name)
                  out.write("LICENSE.md")
          else:
              with tarfile.open(archive, "w:gz") as out:
                  out.add(executable, arcname="novagpt")
                  out.add("LICENSE.md")
          with archive.open("rb") as artifact:
              sha256 = hashlib.file_digest(artifact, "sha256").hexdigest()
          (dist / (archive.name + ".sha256")).write_text(sha256 + "\n", encoding="ascii")
          print(f"Packaged {archive} (sha256 {sha256})")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x86_64 linux-aarch64 windows-x86_64; do
            if [[ "$platform" == windows-* ]]; then
              archive="dist/novagpt-$platform.zip"
            else
              archive="dist/novagpt-$platform.tar.gz"
            fi
            test -s "$archive"
            test -s "$archive.sha256"
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
            expected="$(tr -d '\r\n' < "$archive.sha256")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Checksum mismatch for $archive"
              exit 1
            fi
          done
      - name: Create release and version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NovaGPT $RELEASE_TAG" \
            --generate-notes
